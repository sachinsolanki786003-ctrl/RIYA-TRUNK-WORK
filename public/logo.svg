<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Modern Trunk Icon -->
  <g transform="translate(6, 10)">
    <!-- Main Body -->
    <rect x="2" y="10" width="38" height="26" rx="3" fill="#151515"/>
    <!-- Lid separator -->
    <line x1="2" y1="17" x2="40" y2="17" stroke="#A8ADB2" stroke-width="1.5"/>
    <!-- Heavy Duty Ribs -->
    <line x1="12" y1="19" x2="12" y2="34" stroke="#303030" stroke-width="2"/>
    <line x1="30" y1="19" x2="30" y2="34" stroke="#303030" stroke-width="2"/>
    <!-- Orange Reinforcement Corner Brackets -->
    <path d="M2 14V10H6" stroke="#FF6538" stroke-width="2" stroke-linecap="round"/>
    <path d="M36 10H40V14" stroke="#FF6538" stroke-width="2" stroke-linecap="round"/>
    <path d="M2 32V36H6" stroke="#FF6538" stroke-width="2" stroke-linecap="round"/>
    <path d="M36 36H40V32" stroke="#FF6538" stroke-width="2" stroke-linecap="round"/>
    <!-- Heavy Duty Metal Handle -->
    <path d="M14 10V6C14 4.89543 14.8954 4 16 4H26C27.1046 4 28 4.89543 28 6V10" stroke="#FF6538" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Industrial Latch Lock -->
    <rect x="18" y="15" width="6" height="7" rx="1" fill="#FF6538"/>
    <circle cx="21" cy="18.5" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Typography: RIYA TRUNK WORK -->
  <text x="56" y="32" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="22" font-weight="800" fill="#151515" letter-spacing="-0.5px">
    RIYA<tspan fill="#FF6538">.</tspan>TRUNK WORK
  </text>
  
  <!-- Subtitle: Gujarati & English Tag -->
  <text x="57" y="47" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#737A82" letter-spacing="1.5px">
    રિયા ટ્રંક વર્ક • ESTD. AHMEDABAD
  </text>
</svg>
